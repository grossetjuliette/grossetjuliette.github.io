      username: grossetjuliette
    - network: LinkedIn
      username: juliette-grosset
    - network: Google Scholar
      username: sf6Hqf0AAAAJ

  sections:
    Experience:
      - company: Naval Group / IRL CROSSING, CNRS
        logo: cnrs.png
        position: Post-Doctoral Researcher
        location: Adelaide, Australia
        start_date: 2025-02
        summary: Maritime simulation, multi-agent systems and autonomous robotics in multi-domain environments (aerial, surface, underwater).
        highlights:
          - Development of **LOTUSim**, an open-source real-time maritime simulation platform for human-vehicle teaming, and of **LOTUSim-Energy**, its energy-oriented extension developed within the FACET project.
          - Member of the LOTUSim Technical Committee and co-leader of the Maritime Working Group at IRL CROSSING; in 2026, Naval Group representative on the IRL CROSSING Management Committee, and elected as a non-permanent member of the IRL CROSSING Laboratory Council.

      - company: IMT Atlantique / IRISA
        logo: imt-atlantique.png
        position: Research Engineer
        location: Rennes, France
        start_date: 2024
        end_date: 2024
        summary: 3 months on the Alpha Project (Alstef Group), improving the automation of airport baggage transport with a fleet of autonomous industrial vehicles; ideas from my thesis work are reused in this project.
        highlights:
          - Simulation in CARLA of a scenario with vehicles and an infrastructure camera, to demonstrate the value of local cooperation, using my V2X message generation architecture.

      - company: ECAM Rennes - Louis de Broglie / IMT Atlantique / IRISA
        logo: ecam-rennes.png
        position: PhD Student
        location: Rennes, France
        start_date: 2021
        end_date: 2024
        summary: Collective intelligence strategies for efficient autonomous industrial vehicles (AIVs) in Industry 4.0 contexts, within the EASE team at IRISA.
        highlights:
          - Shared-perception-based obstacle and collision avoidance strategy for AIV fleets.
          - Adaptation of V2X communication standards to Industry 4.0 and a V2X data generation architecture.
          - Decentralised dynamic task (re)allocation mechanism and fuzzy-model-based collective energy management.

