cv:
  name: Juliette Grosset
  label: Post-Doctoral Researcher
  email: jgrosset10@gmail.com
  location: Adelaide, South Australia, Australia
  image: ""
  summary: Post-Doctoral Researcher at Naval Group, hosted in the IRL CROSSING (CNRS) laboratory in Adelaide, Australia. My research covers maritime simulation, multi-agent systems and autonomous robotics in multi-domain environments (aerial, surface and underwater), with a focus on human-vehicle teaming and energy-aware autonomy. I lead the development of LOTUSim, an open-source real-time maritime simulator, and of its energy-oriented extension LOTUSim-Energy.
